<style>
:root{--bg:#f6f4ed;--paper:#fffdf7;--ink:#30372f;--muted:#747b70;--sage:#78866d;--soft:#e6eadf;--line:#e1e2d8;--pink:#eadbd7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,sans-serif}.app{max-width:1050px;margin:auto;padding:22px 16px 100px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.brand{font:32px Georgia,serif;letter-spacing:.2em}.tag,.tiny,.eyebrow{font-size:11px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}.nav button,button,.btn{cursor:pointer;border:1px solid var(--line);border-radius:999px;background:var(--paper);color:var(--ink);padding:9px 14px;font:inherit}.nav button.active,.soft{background:var(--soft);border-color:var(--soft)}button.primary{background:var(--sage);border-color:var(--sage);color:white}.panel,.tile{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:23px;margin-bottom:14px}.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:14px}.serif{font:400 36px/1.2 Georgia,serif;margin:10px 0}.intro,.muted{color:var(--muted)}.quote{font:24px/1.45 Georgia,serif;margin:18px 0}.chips,.actions,.choices{display:flex;gap:8px;flex-wrap:wrap}.chip{background:var(--soft);padding:4px 10px;border-radius:99px;font-size:12px}.landscape{background:linear-gradient(145deg,#e6e9dd,#f2eee2);min-height:270px;position:relative;overflow:hidden;display:flex;align-items:end}.sun{position:absolute;width:120px;height:120px;border-radius:100%;background:#faf4e5;top:30px;left:calc(50% - 60px)}.hill{position:absolute;bottom:25px;left:-10%;width:120%;height:100px;background:#bdc9b3;border-radius:50% 50% 0 0;transform:rotate(-8deg)}.hill2{position:absolute;bottom:-10px;left:-5%;width:120%;height:80px;background:#899b80;border-radius:50% 50% 0 0}.landtext{z-index:1;padding:20px;font:italic 18px Georgia,serif}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.tile h3{font:400 22px Georgia,serif;margin:8px 0}.tile p{color:var(--muted);font-size:14px}.sectionhead{display:flex;justify-content:space-between;align-items:end;margin:28px 0 12px}.sectionhead h2{font:400 28px Georgia,serif;margin:0}.field{margin:17px 0}.field label{display:block;font-size:13px;font-weight:650;margin-bottom:6px}.field textarea,.field input,.field select,.search{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;background:#fffefb;color:var(--ink);font:inherit}.field textarea{min-height:95px;resize:vertical}.choice{border-radius:12px!important;background:#fff!important}.choice.selected{background:var(--soft)!important;border-color:#aebda3!important}.callout{background:#f1ebe5;border-radius:14px;padding:15px;margin:15px 0}.entry{border-top:1px solid var(--line);padding:14px 0}.entry:first-child{border:0}.entry p{white-space:pre-wrap}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:var(--soft);border-radius:14px;padding:14px}.stat strong{display:block;font:30px Georgia,serif}.empty{padding:28px;text-align:center;color:var(--muted)}.hide{display:none}.footer{text-align:center;color:var(--muted);font-size:12px;margin-top:28px}.danger{color:#984f46}.mobile{display:none}
@media(max-width:700px){.app{padding:15px 12px 90px}.hero{grid-template-columns:1fr}.landscape{min-height:155px}.sun{width:80px;height:80px;top:12px;left:calc(50% - 40px)}.hill{height:55px}.hill2{height:40px}.grid{grid-template-columns:1fr 1fr}.panel,.tile{padding:17px}.serif{font-size:31px}.nav{display:none}.mobile{display:flex;position:fixed;bottom:0;left:0;right:0;background:#f6f4edf2;border-top:1px solid var(--line);justify-content:space-around;padding:8px;z-index:5}.mobile button{border:0;background:transparent;padding:5px;font-size:11px}.mobile button.active{color:#53634b;font-weight:700}.stats{gap:5px}.stat{padding:10px}.stat strong{font-size:24px}}
@media(max-width:380px){.grid{grid-template-columns:1fr}}
</style></head><body><div class="app"><header class="top"><div><div class="brand">STILL</div><div class="tag">A personal philosophy practice</div></div><button onclick="page='settings';render()">Settings ⚙</button></header><nav class="nav" id="nav"></nav><main id="main"></main><div class="footer">Think deeply. Live gently. Remain curious.<br>Philosophy is an invitation to examine, not a demand to perfect yourself.</div></div><nav class="mobile" id="mobile"></nav>
<script>
const lessons=[
["Stoicism","The event and the story","Epictetus","Enchiridion, §5","People are disturbed not by things, but by the views they take of them.","A central Stoic distinction: an event and our judgement about it are not identical. This does not mean every difficulty is imaginary or that external harm does not matter.","What have you been treating as a fact that might partly be an interpretation?","Where might this idea become an excuse to dismiss a legitimate feeling or a real problem?","When something catches you emotionally, write two lines: what happened, and the meaning you gave it.","https://classics.mit.edu/Epictetus/epicench.html"],
["Stoicism","Where your effort belongs","Epictetus","Enchiridion, §1","Some things are up to us and some are not.","Epictetus distinguishes our judgements and choices from outcomes and circumstances we cannot fully command. Influence is not the same as control.","Where are you spending energy trying to guarantee an outcome?","Can focusing on what is up to you make you underestimate structural barriers or other people's responsibilities?","Divide a page into: my choices, things I can influence, things I cannot guarantee.","https://classics.mit.edu/Epictetus/epicench.html"],
["Stoicism","Philosophy as a practice","Epictetus","Discourses, 2.9 · paraphrase","Do not merely explain your principles. Practise them.","Epictetus challenges students who can discuss philosophy but do not embody it. This is a paraphrase of his recurring argument, not a verbatim quotation.","What value can you describe well but find difficult to practise?","How can you distinguish sincere practice from performing an identity you want others to see?","Make the smallest observable choice today that expresses one of your values.","https://classics.mit.edu/Epictetus/epicdisc.html"],
["Stoicism","The cost of imagined futures","Seneca","Letters to Lucilius, Letter 13","We suffer more often in imagination than in reality.","This familiar rendering reflects Seneca's discussion of fear and anticipated hardship. It is not a claim that all anxiety is irrational or that feared events never happen.","What future possibility has been taking up more space than the present facts?","When is anticipating a risk prudent preparation rather than needless suffering?","Name the feared outcome, the evidence you have, and one useful action available now.","https://en.wikisource.org/wiki/Moral_letters_to_Lucilius"],
["Stoicism","The shape of attention","Marcus Aurelius","Meditations · thematic paraphrase","The life we experience is shaped by what occupies our mind.","Marcus returns to attention, judgement, and inner orientation. This is a thematic paraphrase, not a direct quotation.","What has received most of your attention lately, and what has received too little?","Can attention alone change a situation, or is concrete action required?","Give ten uninterrupted minutes to something you value, without documenting or optimising it.","https://classics.mit.edu/Antoninus/meditations.html"],
["Buddhism","Nothing stays exactly as it is","Early Buddhist teaching","Anicca · impermanence","Conditioned things are impermanent.","Impermanence invites attention to change and to the ways we ask temporary experiences to provide permanent certainty.","What are you asking to stay unchanged, even though it naturally changes?","How can remembering impermanence deepen care rather than make you detached?","Notice one changing thing today without immediately trying to preserve, label, or fix it.","https://suttacentral.net/"],
["Buddhism","Wanting and clinging","Early Buddhist teaching","Dhammacakkappavattana Sutta, SN 56.11","The teaching identifies craving as a cause of suffering.","This is a summary, not a direct quotation. Ordinary care, affection, and aspiration are not all equivalent to clinging.","What do you want that has become a condition for allowing yourself to feel okay?","Could non-attachment be misused to avoid commitment, grief, or necessary change?","Notice the difference between 'I would like this' and 'I cannot be okay unless this happens.'","https://suttacentral.net/sn56.11"],
["Buddhism","Notice before reacting","Early Buddhist teaching","Satipaṭṭhāna Sutta, MN 10","Mindfulness includes knowing what is present as it is present.","The Satipaṭṭhāna Sutta presents contemplations of body, feeling, mind, and phenomena. Mindfulness is more than relaxation.","What do you notice just before a familiar reaction takes over?","When might observation need to be followed by a boundary or concrete action?","Pause for three breaths and name what is present: sensation, feeling, thought, or urge.","https://suttacentral.net/mn10"],
["Buddhism","Compassion without self-erasure","Buddhist traditions","Brahmavihāra teachings","Compassion wishes suffering to be met with care.","Compassion is not agreement, accepting harmful behaviour, or removing all discomfort. It can include clear boundaries.","Where could you respond with care without abandoning your own needs?","How can compassion include accountability rather than avoidance of conflict?","Try one sentence that is both kind and clear, to yourself or another person.","https://suttacentral.net/"],
["Taoism","Effort without forcing","Laozi","Tao Te Ching, Chapter 37","The Dao does not force, yet nothing is left undone.","Wu wei is often translated as non-action or non-forcing, but need not mean passivity. It points toward action responsive to conditions.","Where might you be pushing harder when a more responsive approach would work better?","How do you distinguish non-forcing from procrastination or fear disguised as acceptance?","Ask before one task: what is the simplest next action that fits the situation?","https://ctext.org/dao-de-jing"],
["Taoism","The strength of softness","Laozi","Tao Te Ching, Chapter 78","Nothing is softer than water, yet nothing surpasses it in overcoming the hard.","Water is an image for adaptability and persistence, not a scientific law.","Where do you equate being strong with being inflexible?","When is firmness essential, and when does flexibility become self-betrayal?","In a small disruption, adapt your method without abandoning your principle.","https://ctext.org/dao-de-jing"],
["Taoism","Enoughness","Laozi","Tao Te Ching, Chapter 44","Knowing what is enough helps prevent being overtaken by wanting.","The chapter connects desire, contentment, and limits. It does not require rejecting ambition; it asks what pursuit costs and what it serves.","What are you pursuing because you value it, and what feels like proof?","Who gets to define 'enough' for you?","Enjoy one thing today without turning it into a target, achievement, or comparison.","https://ctext.org/dao-de-jing"],
["Existentialism","Becoming through choices","Jean-Paul Sartre","Existentialism Is a Humanism","We shape ourselves through what we choose and do.","Sartre argues people are not born with a fully determined essence. This does not mean circumstances are irrelevant or freedom is unlimited.","Which repeated choice is quietly shaping the person you are becoming?","How should responsibility be understood when people's options are constrained?","Choose one action that expresses a value you want to live, even if nobody sees it.","https://www.marxists.org/reference/archive/sartre/works/exist/sartre.htm"],
["Existentialism","Meaning is not always ready-made","Viktor Frankl","Man's Search for Meaning","Meaning may be discovered in how we respond to life.","Frankl's work grew from existential psychiatry and extreme historical suffering. It should not romanticise trauma or imply people are responsible for every hardship.","What feels meaningful even when it is difficult or unrecognised?","Can searching for meaning become another demand you place on yourself?","Give a small amount of attention to one meaningful relationship, responsibility, or act of creation.","https://www.viktorfrankl.org/"],
["Existentialism","Freedom with others in view","Simone de Beauvoir","The Ethics of Ambiguity","Our freedom is lived in a world shared with other freedoms.","De Beauvoir explores how freedom is entangled with other people's freedom. Her ethics is more relational than simply doing whatever you want.","Where do your choices affect someone else's freedom or dignity?","When do competing freedoms create a genuine ethical conflict?","Make one choice that respects both your agency and another person's agency.","https://plato.stanford.edu/entries/beauvoir/"],
["Psychology & neuroscience","The small architecture of habit","William James","The Principles of Psychology, habit chapter","Habit makes actions easier through repetition.","James described habit as powerful in nervous and everyday life. Modern habit science adds nuance: context, reward, friction, and individual differences matter.","What cue or environment makes one behaviour easier than another?","When does habit support freedom, and when might it keep you stuck?","Make a helpful action one step easier, or an unwanted automatic action one step harder.","https://psychclassics.yorku.ca/James/Principles/"],
["Psychology & neuroscience","The brain changes with experience","Neuroscience","Neuroplasticity · modern summary","Experience can change neural connections over time.","Cajal helped establish the neuron doctrine. This is a modern summary, not a Cajal quotation. Neuroplasticity is real, but not limitless or instant.","What skill, idea, or response are you practising often enough to shape over time?","How can the language of neuroplasticity oversimplify biology or context?","Spend ten focused minutes practising one small skill rather than waiting to feel naturally good at it.","https://www.nobelprize.org/prizes/medicine/1906/cajal/biographical/"],
["Psychology","Reframing without pretending","Cognitive psychology","Emotion regulation research","Changing an interpretation can sometimes change an emotional response.","Reappraisal means considering another interpretation, not forcing a positive one. It should not erase evidence of harm or legitimate emotion.","What is another plausible explanation for a situation, without insisting it must be true?","How do you keep reappraisal from turning into self-gaslighting?","Write your first interpretation and one alternative that fits the available evidence.","https://doi.org/10.1037/0033-295X.102.2.224"],
["Psychology","Attention is not effortless","William James","The Principles of Psychology, attention","Attention selects some parts of experience over others.","Attention is shaped by fatigue, stress, environment, and biology as well as intention.","What repeatedly captures your attention, and what does it reveal about your concerns?","When is distraction a problem, and when is it a signal that you need rest?","Put your phone out of reach for ten minutes while doing one chosen activity.","https://psychclassics.yorku.ca/James/Principles/"],
["Positive psychology","Notice the good without denying the hard","Positive psychology research","Gratitude research","Attention to positive experiences can help make them more visible in memory.","Gratitude practices help some people, but effects vary. Gratitude should never silence pain or inequality.","What small good thing happened today that you might otherwise forget?","When can gratitude become pressure to accept circumstances that need to change?","Record one specific moment and why it mattered, even if the day was difficult.","https://doi.org/10.1037/0022-3514.84.2.377"],
["Positive psychology","Absorption and flow","Mihaly Csikszentmihalyi","Flow: The Psychology of Optimal Experience","Deep engagement often appears when challenge and skill are well matched.","Flow describes absorption in an activity, often with clear goals and feedback. Rest and low-effort pleasure matter too.","When did you last become absorbed in something without monitoring yourself?","Can the pursuit of flow become another way of refusing to rest?","Give 15 minutes to an activity with a clear next step and manageable challenge.","https://www.ted.com/talks/mihaly_csikszentmihalyi_flow_the_secret_to_happiness"],
["Positive psychology","Use a strength in a new way","Positive psychology research","Character strengths research","A strength can become more useful when applied deliberately and flexibly.","Strengths frameworks can support reflection, but they are not fixed labels or a complete explanation of a person.","What quality helped you recently, and where could you use it differently?","Can identifying strengths create blind spots or make you perform a fixed identity?","Choose curiosity, persistence, humour, or kindness and use it in a new context.","https://www.viacharacter.org/"],
["Psychology","Speak to yourself as a person, not a project","Kristin Neff","Self-compassion research","Self-compassion combines kindness, common humanity, and mindful awareness.","Self-compassion is not self-excuse. It means responding to difficulty with honesty and care rather than contempt.","What changes if you treat this struggle as something to understand rather than evidence against yourself?","How can kindness coexist with accountability and change?","Write one accurate, kind sentence about something you found difficult today.","https://self-compassion.org/"],
["Psychology","Make room for not knowing","Acceptance and Commitment Therapy","Psychological flexibility","A thought can be present without needing to dictate your next action.","ACT uses acceptance, defusion, values, and committed action to help people relate differently to internal experiences.","What are you waiting to feel certain about before you let yourself move?","When is waiting for more information wise, and when does it become avoidance?","Name the uncertainty, then take one small values-aligned step that doesn't require certainty.","https://contextualscience.org/act"],
["Psychology","Values are directions, not finish lines","Acceptance and Commitment Therapy","Values clarification","A value can guide repeated action without ever being permanently completed.","In ACT, values are chosen qualities of action, distinct from goals that can be checked off.","What quality do you want to bring to work, love, learning, or rest?","How do you know a value is yours rather than borrowed from approval?","Choose one small action that expresses that quality regardless of outcome.","https://contextualscience.org/act"],
["Positive psychology","Let a good moment be enough","Positive psychology research","Savoring research","Savoring means attending to and appreciating a positive experience.","Savoring is not forced happiness. It means allowing a pleasant moment to register before moving on.","Was there a small moment today that felt good before you judged whether it was important?","Can trying to savour a moment make you self-conscious?","Pause for twenty seconds during one pleasant moment. Notice a sensory detail.","https://ppc.sas.upenn.edu/"],
["Existentialism","You are not only the story you tell","Existential philosophy","Reflective synthesis, not a quotation","An identity can be examined, revised, and lived rather than merely declared.","Existentialist thinkers disagree about freedom and selfhood. This prompt invites inquiry rather than claiming there is one fixed hidden self.","Which story about yourself do you repeat, and what evidence complicates it?","Can constant self-analysis become another way of avoiding direct experience?","Describe yourself through three actions or choices from this week rather than adjectives alone.","https://plato.stanford.edu/entries/existentialism/"],
["Buddhism","Letting go is not not caring","Buddhist traditions","Non-clinging · interpretations vary","Care and clinging are not the same thing.","Non-clinging does not mean emotional coldness. It points toward caring without demanding that people and outcomes remain exactly as we wish.","What would caring look like if you did not need to own the outcome?","How do you distinguish healthy investment from clinging, especially in relationships?","Do one caring thing today without using the result as a verdict on your worth.","https://suttacentral.net/"],
["Positive psychology","Play has value without a result","Motivation research","Intrinsic motivation","An activity can be worthwhile because engaging in it is rewarding in itself.","Intrinsic motivation describes doing something for its inherent satisfaction; real-world motivation is often mixed.","What would you do if it didn't need to make you more impressive or productive?","Can you enjoy achievement without turning every interest into performance?","Spend ten minutes on something playful or curious without tracking progress.","https://selfdeterminationtheory.org/"],
["Psychology","A reaction can become information","Emotion regulation research","General synthesis","An emotion can carry information without being the whole truth about a situation.","Emotions can reflect needs, appraisals, body states, memories, and context. They deserve attention but may not be a complete account of reality.","What might this reaction be signalling, and what else do you need to know?","When should you trust an emotional signal, and when should you gather more information?","Name the emotion, its possible message, and one fact you still need to check.","https://www.apa.org/topics/emotions"],
["Taoism","Rest is part of rhythm","Taoist-inspired reflection","Original reflection, not a classical quotation","Not every moment needs to be converted into progress.","This contemporary prompt is inspired by Taoist themes of naturalness and non-forcing; it is not a statement attributed to Laozi.","Where have you made rest something you must earn?","How can you respect rest while still meeting real responsibilities?","Take a short, deliberate pause without trying to make it useful.","https://ctext.org/dao-de-jing"]
].map((a,i)=>({id:"l"+i,tradition:a[0],title:a[1],author:a[2],source:a[3],quote:a[4],note:a[5],question:a[6],challenge:a[7],practice:a[8],url:a[9]}));
const themes=["Notice the pattern","Consider the counterexample","Connect it to a relationship"];
const prompts=["Where does this idea fit your experience, and where does it fail to fit?","What would someone who disagrees say, and what might they be right about?","What changes when you apply this to an ordinary moment rather than a crisis?"];
const practices=["Notice one ordinary moment where this idea might apply. Record what you observed.","Test the idea gently, then record what helped and what felt incomplete.","Explain the idea in your own words, then try one small action."];
const challenges=["What is the strongest objection you can make to this idea?","What assumptions does this idea depend on, and are they always true?","Could this advice help one person but harm another in a different context?"];
const library=Array.from({length:90},(_,i)=>{let b=lessons[i%lessons.length],r=Math.floor(i/lessons.length);return {...b,day:i+1,title:r?b.title+" · "+themes[(r-1)%3]:b.title,question:r?prompts[(r-1)%3]:b.question,practice:r?practices[(r-1)%3]:b.practice,challenge:r?challenges[(r-1)%3]:b.challenge,note:r?b.note+" Further lens: "+themes[(r-1)%3]+".":b.note}});
const KEY="still-data-v1";let S={entries:[],favorites:[],experiments:[],letters:[],beliefs:[],reviews:[],completed:[],settings:{start:new Date().toISOString().slice(0,10)}};let page="today",lesson=null,ratings={mood:null,presence:null};
try{S={...S,...JSON.parse(localStorage.getItem(KEY)||"{}")}}catch(e){}
function save(){localStorage.setItem(KEY,JSON.stringify(S));}
function esc(s=""){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function today(){return new Date().toISOString().slice(0,10)}
function day(){return Math.max(1,Math.floor((new Date(today())-new Date(S.settings.start||today()))/86400000)+1)}
function daily(){return library[(day()-1)%library.length]}
function nav(){let tabs=[["today","Today"],["explore","Explore"],["journal","Journal"],["growth","Growth"],["philosophy","My Philosophy"]];document.getElementById("nav").innerHTML=tabs.map(([k,v])=>`<button class="${page===k?"active":""}" onclick="go('${k}')">${v}</button>`).join("");document.getElementById("mobile").innerHTML=tabs.map(([k,v])=>`<button class="${page===k?"active":""}" onclick="go('${k}')">${v}</button>`).join("")}
function go(p){page=p;render()}
function open(id){lesson=library.find(x=>x.id===id)||daily();page="reading";render()}
function render(){nav();let m=document.getElementById("main");if(page==="today")m.innerHTML=home();if(page==="reading")m.innerHTML=reading();if(page==="explore")m.innerHTML=explore();if(page==="journal")m.innerHTML=journal();if(page==="growth")m.innerHTML=growth();if(page==="philosophy")m.innerHTML=philosophy();if(page==="settings")m.innerHTML=settings()}
function home(){let l=daily();return `<section class="hero"><div class="panel"><div class="eyebrow">${new Date().toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"})} · DAY ${day()}</div><h1 class="serif">A little more presence.</h1><p class="intro">Read something carefully, question it, and take one idea into your life. You don't need to solve everything today.</p><div class="chips"><span class="chip">${l.tradition}</span><span class="chip">5–10 min</span></div><div class="eyebrow">TODAY'S IDEA</div><h2 class="serif" style="font-size:29px">${esc(l.title)}</h2><div class="quote">“${esc(l.quote)}”</div><div class="tiny">${esc(l.author)} · ${esc(l.source)}</div><div class="actions"><button class="primary" onclick="open('${l.id}')">Begin today's practice →</button><button onclick="go('journal')">Daily reflection</button></div></div><div class="panel landscape"><div class="sun"></div><div class="hill"></div><div class="hill2"></div><div class="landtext">Let the day teach you something.</div></div></section><div class="sectionhead"><h2>Practise living</h2></div><div class="grid"><article class="tile"><div class="eyebrow">TRY</div><h3>Experiments in living</h3><p>Test a small idea in real life.</p><button class="soft" onclick="go('experiments')">Choose an experiment</button></article><article class="tile"><div class="eyebrow">NOTICE</div><h3>A small good thing</h3><p>Save a cute moment, an ordinary pleasure, or anything you want to remember.</p><button class="soft" onclick="go('journal')">Write it down</button></article><article class="tile"><div class="eyebrow">QUESTION</div><h3>What challenged me?</h3><p>Agree, disagree, or stay unsure.</p><button class="soft" onclick="open('${l.id}')">Challenge today's idea</button></article></div><div class="panel"><div class="stats"><div class="stat"><span class="tiny">Reflections</span><strong>${S.entries.length}</strong></div><div class="stat"><span class="tiny">Experiments</span><strong>${S.experiments.length}</strong></div><div class="stat"><span class="tiny">Saved ideas</span><strong>${S.favorites.length}</strong></div></div><p class="muted">Return after a day, a week, or a month. Nothing is lost by taking a break.</p></div>`}
function reading(){let l=lesson||daily(),e=S.entries.find(x=>x.date===today()&&x.id===l.id)||{};let choices=["I agree with this idea","I disagree with part of it","I'm not sure yet","It connects to something I've experienced"];return `<section class="panel"><div class="eyebrow">${esc(l.tradition)} · DAY ${l.day} · 5–10 MINUTES</div><h1 class="serif">${esc(l.title)}</h1><div class="quote">“${esc(l.quote)}”</div><div class="tiny">${esc(l.author)} · ${esc(l.source)} · <a target="_blank" rel="noopener" href="${esc(l.url)}">Explore source ↗</a></div><div class="callout"><div class="eyebrow">UNDERSTAND THE IDEA</div>${esc(l.note)}</div><div class="field"><label>Reflect · ${esc(l.question)}</label><textarea id="reflect" placeholder="Write what comes to mind. There is no expected answer.">${esc(e.reflect||"")}</textarea></div><div class="field"><label>What challenged me?</label><p class="muted">Choose a starting point, or write your own.</p><div class="choices">${choices.map(c=>`<button class="choice ${e.position===c?"selected":""}" onclick="document.querySelectorAll('.choice').forEach(x=>x.classList.remove('selected'));this.classList.add('selected');this.dataset.val='${esc(c)}'">${esc(c)}</button>`).join("")}</div><input id="custom" placeholder="Or put it in your own words…" value="${esc(e.custom||"")}" style="width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;margin-top:9px"></div><div class="field"><label>What is the strongest objection you can think of?</label><textarea id="challenge" placeholder="${esc(l.challenge)}">${esc(e.challenge||"")}</textarea></div><div class="field"><label>Experiment in living · one small thing to try</label><textarea id="practice" placeholder="${esc(l.practice)}">${esc(e.practice||"")}</textarea></div><div class="field"><label>After trying it, what did you notice?</label><textarea id="outcome" placeholder="Come back later. What happened?">${esc(e.outcome||"")}</textarea></div><div class="actions"><button class="primary" onclick="saveLesson('${l.id}')">Save reflection</button><button onclick="favorite('${l.id}')">${S.favorites.includes(l.id)?"♥ Saved idea":"♡ Save idea"}</button><button onclick="go('explore')">Library</button></div></section>`}
function val(id){return document.getElementById(id)?.value.trim()||""}
function saveLesson(id){let l=library.find(x=>x.id===id),sel=document.querySelector(".choice.selected"),i=S.entries.findIndex(e=>e.date===today()&&e.id===id),e={date:today(),id,title:l.title,tradition:l.tradition,reflect:val("reflect"),position:sel?.dataset.val||"",custom:val("custom"),challenge:val("challenge"),practice:val("practice"),outcome:val("outcome")};if(i>=0)S.entries[i]=e;else S.entries.unshift(e);if(!S.completed.includes(today()))S.completed.push(today());save();alert("Your reflection is saved.");go("today")}
function favorite(id){S.favorites=S.favorites.includes(id)?S.favorites.filter(x=>x!==id):[...S.favorites,id];save();render()}
function explore(){let traditions=[...new Set(library.map(x=>x.tradition))];return `<div class="sectionhead"><h2 class="serif">Explore ideas</h2><span class="tiny">90-day starter plan</span></div><p class="intro">Move between traditions. Follow curiosity. Keep what helps, question what doesn't.</p><input class="search" id="search" placeholder="Search ideas, thinkers, traditions…" oninput="filter()" style="width:100%;padding:12px;border:1px solid var(--line);border-radius:12px"><div class="choices" style="margin:12px 0" id="filters"><button class="choice selected" onclick="setFilter('All',this)">All</button>${traditions.map(t=>`<button class="choice" onclick="setFilter('${esc(t)}',this)">${esc(t)}</button>`).join("")}</div><div class="grid" id="cards">${cards(library)}</div>`}
let trad="All";function setFilter(t,b){trad=t;document.querySelectorAll("#filters button").forEach(x=>x.classList.remove("selected"));b.classList.add("selected");filter()}function filter(){let q=val("search").toLowerCase();document.getElementById("cards").innerHTML=cards(library.filter(x=>(trad==="All"||x.tradition===trad)&&[x.title,x.author,x.tradition,x.note].join(" ").toLowerCase().includes(q)))}
function cards(list){return list.map(l=>`<article class="tile"><div class="eyebrow">${esc(l.tradition)}</div><h3>${esc(l.title)}</h3><p>${esc(l.author)} · ${esc(l.source)}</p><p>${esc(l.note.slice(0,115))}…</p><button class="soft" onclick="open('${l.id}')">Read & reflect →</button> ${S.favorites.includes(l.id)?"♥":""}</article>`).join("")||'<div class="empty">No readings found.</div>'}
function journal(){let es=[...S.entries].sort((a,b)=>b.date.localeCompare(a.date));return `<div class="sectionhead"><h2 class="serif">Your journal</h2><span class="tiny">${S.entries.length} entries</span></div><section class="panel"><div class="eyebrow">A SMALL GOOD THING</div><h2 class="serif" style="font-size:28px">What would you like to remember about today?</h2><p class="muted">A cute moment, a conversation, a meal, something funny, a silver lining, or absolutely anything.</p><div class="field"><textarea id="good" placeholder="Today, something that made me smile was…"></textarea></div><div class="field"><label>How did today go, in your own words?</label><textarea id="dayref" placeholder="No rating required. Just write whatever feels worth noting."></textarea></div><div class="field"><label>How did today feel overall? (optional)</label><div class="choices">${[["1","😔"],["2","😕"],["3","😐"],["4","🙂"],["5","😊"]].map(([v,e])=>`<button class="choice" onclick="pick('mood',${v},this)">${e}</button>`).join("")}</div></div><div class="field"><label>How present did you feel? (optional)</label><div class="choices">${[1,2,3,4,5].map(v=>`<button class="choice" onclick="pick('presence',${v},this)">${v}</button>`).join("")}</div></div><div class="actions"><button class="primary" onclick="saveDaily()">Save today's reflection</button><button onclick="go('letters')">Write to future me →</button></div></section><div class="sectionhead"><h2>Previous entries</h2></div><section class="panel">${es.map(e=>`<article class="entry"><div class="tiny">${esc(e.date)} · ${esc(e.tradition||"Daily life")}</div><h3>${esc(e.title||"A day worth remembering")}</h3>${e.reflect?`<p>${esc(e.reflect)}</p>`:""}${e.position?`<p><b>My response:</b> ${esc(e.position)}</p>`:""}${e.custom?`<p>${esc(e.custom)}</p>`:""}${e.challenge?`<p><b>What challenged me:</b> ${esc(e.challenge)}</p>`:""}${e.outcome?`<p><b>What I noticed:</b> ${esc(e.outcome)}</p>`:""}${e.good?`<p><b>A good thing:</b> ${esc(e.good)}</p>`:""}${e.dayref?`<p>${esc(e.dayref)}</p>`:""}${e.practice?`<p><b>Practice:</b> ${esc(e.practice)}</p>`:""}<button onclick="delEntry('${e.date}','${e.id||"daily"}')">Delete entry</button></article>`).join("")||'<div class="empty">Your entries will appear here. They don't need to be profound to be worth keeping. 🌿</div>'}</section>`}
function pick(k,v,b){ratings[k]=v;b.parentElement.querySelectorAll("button").forEach(x=>x.classList.remove("selected"));b.classList.add("selected")}
function saveDaily(){let i=S.entries.findIndex(e=>e.date===today()&&e.id==="daily"),e={date:today(),id:"daily",title:"Daily reflection",good:val("good"),dayref:val("dayref"),mood:ratings.mood,presence:ratings.presence};if(i>=0)S.entries[i]={...S.entries[i],...e};else S.entries.unshift(e);save();alert("A small moment kept.");go("journal")}
function delEntry(d,id){if(confirm("Delete this entry?")){S.entries=S.entries.filter(e=>!(e.date===d&&(e.id||"daily")===id));save();render()}}
function experiments(){let opts=[["Attention","Spend ten minutes doing one thing without switching tasks."],["Letting go","Do one caring thing without checking whether it produced the outcome you wanted."],["Curiosity","Ask one genuine follow-up question before sharing your own view."],["Play","Spend ten minutes on something you enjoy without tracking progress."],["Courage","Take one small step you've postponed because you wanted certainty."],["Savoring","Notice one pleasant ordinary moment for twenty seconds."],["Flexibility","When a plan changes, adapt your method before judging the day."],["Boundaries","Practise one kind, clear sentence expressing a need or limit."]];return `<div class="sectionhead"><h2 class="serif">Experiments in living</h2></div><p class="intro">Ideas become clearer when you try them. These are experiments, not tests you can fail.</p><div class="grid">${opts.map((o,i)=>`<article class="tile"><div class="eyebrow">EXPERIMENT ${i+1}</div><h3>${o[0]}</h3><p>${o[1]}</p><button class="soft" onclick="addExperiment('${o[0]}','${o[1]}')">Try this</button></article>`).join("")}</div><div class="sectionhead"><h2>Your experiments</h2></div><section class="panel">${S.experiments.slice().reverse().map((e,i)=>`<article class="entry"><div class="tiny">${e.date}</div><h3>${esc(e.title)}</h3><p>${esc(e.description)}</p><div class="field"><label>What happened?</label><textarea id="exp${i}">${esc(e.outcome||"")}</textarea></div><button onclick="saveExp(${S.experiments.length-1-i},'exp${i}')">Save observation</button></article>`).join("")||'<div class="empty">Choose a small experiment to begin.</div>'}</section>`}
function addExperiment(title,description){S.experiments.push({date:today(),title,description,outcome:""});save();render()}
function saveExp(i,id){S.experiments[i].outcome=document.getElementById(id).value;save();render()}
function letters(){return `<section class="panel"><div class="eyebrow">A LETTER ACROSS TIME</div><h1 class="serif">Dear future me,</h1><p class="intro">Write to a version of yourself who will read this in a month, three months, or a year.</p><div class="field"><label>Revisit this letter</label><select id="when"><option value="30">In one month</option><option value="90">In three months</option><option value="365">In one year</option></select></div><div class="field"><label>What do I want future me to remember?</label><textarea id="letterbody" placeholder="What matters right now? What am I learning, afraid of, curious about, or looking forward to?"></textarea></div><div class="field"><label>What am I working through?</label><textarea id="letternow" placeholder="You don't have to make it sound resolved."></textarea></div><div class="field"><label>What do I hope future me has made room for?</label><textarea id="letterhope" placeholder="More of what? Less of what? What do I want to keep alive?"></textarea></div><button class="primary" onclick="saveLetter()">Save this letter</button><div class="sectionhead"><h2>Letters waiting for you</h2></div>${S.letters.slice().reverse().map(l=>`<article class="entry"><div class="tiny">Written ${l.date} · Revisit ${l.revisit} ${today()>=l.revisit?"· Ready to revisit":""}</div><p>${esc(l.body)}</p><p>${esc(l.now)}</p><p>${esc(l.hope)}</p></article>`).join("")||'<div class="empty">Your future letters will collect here.</div>'}</section>`}
function saveLetter(){if(!val("letterbody"))return alert("Write a little before saving.");let d=new Date();d.setDate(d.getDate()+Number(document.getElementById("when").value));S.letters.push({date:today(),revisit:d.toISOString().slice(0,10),body:val("letterbody"),now:val("letternow"),hope:val("letterhope")});save();go("letters")}
function growth(){let scored=S.entries.filter(e=>e.presence);return `<div class="sectionhead"><h2 class="serif">Your growth</h2></div><p class="intro">Look for patterns with curiosity, not judgement. A difficult week is not a failed practice.</p><div class="panel"><div class="stats"><div class="stat"><span class="tiny">Reflections</span><strong>${S.entries.length}</strong></div><div class="stat"><span class="tiny">Days practised</span><strong>${S.completed.length}</strong></div><div class="stat"><span class="tiny">Saved ideas</span><strong>${S.favorites.length}</strong></div></div><div class="sectionhead"><h2>Monthly review</h2></div><div class="field"><label>What idea stayed with me?</label><textarea id="revidea"></textarea></div><div class="field"><label>What changed or surprised me?</label><textarea id="revchange"></textarea></div><div class="field"><label>What do I want to practise next?</label><textarea id="revnext"></textarea></div><button class="primary" onclick="saveReview()">Save monthly review</button></div><div class="panel"><h2 class="serif">Presence check-ins</h2><p class="muted">Based on your actual optional ratings.</p><div class="grid">${scored.slice(-12).map(e=>`<div class="tile"><div class="tiny">${e.date}</div><h3>${e.presence}/5</h3></div>`).join("")||'<div class="empty">Add optional presence ratings in your daily reflection to see your check-ins here.</div>'}</div></div><section class="panel"><h2 class="serif">Saved monthly reviews</h2>${S.reviews.slice().reverse().map(r=>`<article class="entry"><div class="tiny">${r.date}</div><p><b>Stayed with me:</b> ${esc(r.idea)}</p><p><b>Changed:</b> ${esc(r.change)}</p><p><b>Next:</b> ${esc(r.next)}</p></article>`).join("")||'<div class="empty">Your monthly reviews will collect here.</div>'}</section>`}
function saveReview(){S.reviews.push({date:today(),idea:val("revidea"),change:val("revchange"),next:val("revnext")});save();render()}
function philosophy(){let qs=["What makes a life meaningful?","What do I believe about human nature?","What is worth pursuing?","What does it mean to know myself?","How do I want to treat people?","What does a good relationship with myself look like?"];return `<div class="sectionhead"><h2 class="serif">My Philosophy</h2></div><p class="intro">Not a fixed identity or final answer. A living record of what you believe, question, and revise.</p><section class="panel"><div class="grid">${qs.map(q=>`<article class="tile"><h3>${q}</h3><button class="soft" onclick="belief('${q}')">Reflect on this →</button></article>`).join("")}</div><div class="field"><label>Create your own question</label><input id="ownq" placeholder="A question I want to explore…"></div><button onclick="belief(val('ownq'))">Add my question</button></section><section class="panel"><h2 class="serif">Your evolving answers</h2>${S.beliefs.slice().reverse().map(b=>`<article class="entry"><div class="tiny">${b.date} · ${esc(b.q)}</div><p>${esc(b.a)}</p></article>`).join("")||'<div class="empty">Return to a question later and compare how your thinking evolves.</div>'}</section>`}
function belief(q){if(!q)return;let a=prompt(q+"\n\nWrite your answer in your own words:");if(a?.trim()){S.beliefs.push({date:today(),q,a:a.trim()});save();render()}}
function settings(){return `<section class="panel"><h1 class="serif">Settings & privacy</h1><div class="callout"><b>Device sync is not active in this first version.</b><p>GitHub hosts the website; it does not sync journal entries. Your data is stored in this browser only. You can export a backup on one device and import it on the other. The README explains how to add secure cloud sync with Supabase.</p></div><div class="actions"><button class="primary" onclick="exportData()">Export my data</button><label class="btn" for="importfile">Import backup</label><input class="hide" id="importfile" type="file" accept="application/json" onchange="importData(event)"><button onclick="document.getElementById('syncguide').classList.toggle('hide')">Cloud sync notes</button></div><div id="syncguide" class="callout hide"><p>Use Supabase authentication and a private per-user table with row-level security. Configure the project URL and public anon key in the frontend. Never expose a service-role key. Implement and test login, loading, saving, conflict handling, and recovery before storing personal journal entries.</p></div><div class="field"><label>Practice start date</label><input id="startdate" type="date" value="${esc(S.settings.start||today())}"></div><button class="soft" onclick="S.settings.start=val('startdate')||today();save();render()">Save start date</button><div class="sectionhead"><h2>Delete local data</h2></div><p class="muted">Export first if you want a backup.</p><button onclick="clearData()" style="color:#984f46">Delete my local data</button></section>`}
function exportData(){let a=document.createElement("a"),u=URL.createObjectURL(new Blob([JSON.stringify({app:"STILL",version:1,state:S},null,2)],{type:"application/json"}));a.href=u;a.download="still-backup-"+today()+".json";a.click();URL.revokeObjectURL(u)}
function importData(ev){let f=ev.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result),n=x.state||x;if(!Array.isArray(n.entries))throw 0;if(confirm("Replace data on this device with this backup?")){S={...S,...n};save();render()}}catch(e){alert("This doesn't look like a valid STILL backup.")}};r.readAsText(f)}
function clearData(){if(confirm("Delete all STILL data saved in this browser?")){localStorage.removeItem(KEY);S={entries:[],favorites:[],experiments:[],letters:[],beliefs:[],reviews:[],completed:[],settings:{start:today()}};save();render()}}
const oldRender=render;render=function(){if(page==="experiments")document.getElementById("main").innerHTML=experiments();else if(page==="letters")document.getElementById("main").innerHTML=letters();else oldRender()};
render();
</script></body></html>
